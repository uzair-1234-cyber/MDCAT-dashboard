<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var _origFetch = window.fetch;
          if (_origFetch) {
            var _curFetch = _origFetch;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() { return _curFetch; },
              set: function(fn) { _curFetch = fn; }
            });
          }
        } catch (_) {}

        window.addEventListener('error', function(e) {
          var loader = document.getElementById('boot-loader');
          if (loader) {
            loader.innerHTML = '<div style="max-width:440px;padding:24px;background:#1e293b;border-radius:12px;border:1px solid #ef4444;text-align:center;"><div style="color:#ef4444;font-weight:bold;font-size:16px;margin-bottom:8px;">Initialization Notice</div><div style="color:#cbd5e1;font-size:12px;font-family:monospace;white-space:pre-wrap;word-break:break-all;margin-bottom:16px;">' + (e.message || 'Error loading application') + '</div><button onclick="location.reload()" style="background:#06b6d4;color:white;border:none;padding:8px 16px;border-radius:8px;font-weight:bold;cursor:pointer;">Reload Application</button></div>';
          }
        });
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MDCAT PREP - Medical Study & Entrance Preparation Dashboard</title>
    <meta name="description" content="AI-powered study command center and MDCAT preparation dashboard for First-Year Sindh Board medical aspirants covering Biology, Chemistry, Physics, and English." />
    <meta property="og:title" content="MDCAT PREP - Medical Study & Entrance Preparation Dashboard" />
    <meta property="og:description" content="AI-powered study command center and MDCAT preparation dashboard for First-Year Sindh Board medical aspirants covering Biology, Chemistry, Physics, and English." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root">
      <div id="boot-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; color: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; gap: 14px;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(6,182,212,0.25); border-top-color: #06b6d4; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <div style="font-weight: 700; font-size: 19px; letter-spacing: -0.02em; color: #f8fafc;">MediPrep AI</div>
        <div style="font-size: 13px; color: #94a3b8; font-weight: 500;">Loading Sindh Board Medical Command Center...</div>
        <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
